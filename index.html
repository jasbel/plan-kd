<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Imágenes SVG para Productos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🎨 Generador de SVG para E-commerce</h1>
      <p>Crea imágenes vectoriales (SVG) de productos para tu tienda y descárgalas en un archivo ZIP.</p>
    </header>

    <main class="panel">
      <section class="config">
        <div class="field">
          <label for="quantity">Cantidad de imágenes</label>
          <input type="number" id="quantity" min="1" max="200" value="12">
        </div>

        <div class="field">
          <label for="size">Tamaño (px)</label>
          <select id="size">
            <option value="400">400 x 400</option>
            <option value="600" selected>600 x 600</option>
            <option value="800">800 x 800</option>
            <option value="1024">1024 x 1024</option>
          </select>
        </div>

        <div class="field">
          <span class="field-label">Categorías de productos</span>
          <div class="categories" id="categories">
            <label class="category"><input type="checkbox" value="electronica" checked> 📱 Electrónica</label>
            <label class="category"><input type="checkbox" value="moda" checked> 👕 Ropa y Moda</label>
            <label class="category"><input type="checkbox" value="hogar" checked> 🛋️ Hogar y Muebles</label>
            <label class="category"><input type="checkbox" value="belleza" checked> 💄 Belleza y Cosméticos</label>
            <label class="category"><input type="checkbox" value="alimentos"> 🍎 Alimentos y Bebidas</label>
            <label class="category"><input type="checkbox" value="deportes"> ⚽ Deportes y Aire Libre</label>
            <label class="category"><input type="checkbox" value="juguetes"> 🧸 Juguetes y Niños</label>
            <label class="category"><input type="checkbox" value="joyeria"> 💍 Joyería y Accesorios</label>
            <label class="category"><input type="checkbox" value="mascotas"> 🐾 Mascotas</label>
            <label class="category"><input type="checkbox" value="tecnologia"> 💻 Tecnología y Oficina</label>
          </div>
          <div class="cat-actions">
            <button type="button" id="selectAll" class="link-btn">Seleccionar todas</button>
            <button type="button" id="selectNone" class="link-btn">Quitar todas</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="badge">Incluir etiqueta de precio</label>
          <input type="checkbox" id="badge" checked>
        </div>

        <div class="actions">
          <button id="generateBtn" class="btn btn-primary">Generar imágenes</button>
          <button id="downloadBtn" class="btn btn-secondary" disabled>Descargar ZIP</button>
        </div>

        <p class="status" id="status"></p>
      </section>

      <section class="preview-section">
        <h2>Vista previa</h2>
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Generador SVG para E-commerce &middot; v1.1.0</p>
    </footer>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="generators.js"></script>
  <script src="app.js"></script>
</body>
</html>
